name: Component regression
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash
env:
  CI_FORK_HOST_FALLBACK_IP: ${{ vars.CI_FORK_HOST_FALLBACK_IP }}
  GYC_CI_BUILD_CACHE: 'true'
  JAVA_TOOL_OPTIONS: -Dsun.net.client.defaultConnectTimeout=30000 -Dsun.net.client.defaultReadTimeout=60000
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: gycrosskit/.github/actions/ci-tools@607ff44db144c68fc6523de38c04aac29e427b68
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - run: test -f "$ANDROID_HOME/platforms/android-36/android.jar"
      - run: bash scripts/ci-pin-fork-host.sh
        timeout-minutes: 3
      - name: Test and compile Android sources
        timeout-minutes: 30
        run: |
          python3 scripts/ci-run.py --no-progress-seconds 300 --log ci-diagnostics/android.log -- \
            bash gradlew --init-script "$PWD/scripts/ci-repositories.gradle" --info \
            :dynamic-page-core:testDebugUnitTest :dynamic-page-kuikly:testDebugUnitTest \
            :dynamic-page-core:compileReleaseKotlinAndroid :dynamic-page-kuikly:compileReleaseKotlinAndroid \
            --no-daemon --max-workers=1
      - name: Save logs and test XML
        if: always()
        uses: gycrosskit/.github/actions/ci-diagnostics@607ff44db144c68fc6523de38c04aac29e427b68
        with:
          status: ${{ job.status }}
  native:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: gycrosskit/.github/actions/ci-tools@607ff44db144c68fc6523de38c04aac29e427b68
      - id: xcode
        run: echo "version=$(xcodebuild -version | shasum -a 256 | awk '{print $1}')" >> "$GITHUB_OUTPUT"
      - id: konan
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            ~/.konan
            !~/.konan/dependencies/cache
            !~/.konan/**/*.part
            !~/.konan/**/*.tmp
            !~/.konan/**/*.lock
          key: konan-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode.outputs.version }}-${{ hashFiles('build.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - run: bash scripts/ci-pin-fork-host.sh
        timeout-minutes: 3
      - name: Compile all Native source targets
        timeout-minutes: 50
        run: |
          python3 scripts/ci-run.py --no-progress-seconds 300 --log ci-diagnostics/native.log -- \
            bash gradlew --init-script "$PWD/scripts/ci-repositories.gradle" --info \
            :dynamic-page-core:compileKotlinIosArm64 :dynamic-page-kuikly:compileKotlinIosArm64 \
            :dynamic-page-core:compileKotlinIosSimulatorArm64 :dynamic-page-kuikly:compileKotlinIosSimulatorArm64 \
            :dynamic-page-core:compileKotlinIosX64 :dynamic-page-kuikly:compileKotlinIosX64 \
            :dynamic-page-core:compileKotlinOhosArm64 :dynamic-page-kuikly:compileKotlinOhosArm64 \
            --no-daemon --max-workers=1
      - name: Cache successful Native downloads
        if: success() && steps.konan.outputs.cache-hit != 'true'
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            ~/.konan
            !~/.konan/dependencies/cache
            !~/.konan/**/*.part
            !~/.konan/**/*.tmp
            !~/.konan/**/*.lock
          key: ${{ steps.konan.outputs.cache-primary-key }}
      - name: Save logs and test XML
        if: always()
        uses: gycrosskit/.github/actions/ci-diagnostics@607ff44db144c68fc6523de38c04aac29e427b68
        with:
          status: ${{ job.status }}
